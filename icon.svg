<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Battery Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Cyan Glowing Outline -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="6"/>

  <!-- Glowing Circular Shield in background -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#cyan-glow)" stroke-width="4" opacity="0.15" />
  
  <!-- Glowing Hexagonal Shield Grid Backing -->
  <path d="M256,90 L390,167 L390,323 L256,400 L122,323 L122,167 Z" fill="none" stroke="#334155" stroke-dasharray="10 6" stroke-width="3" opacity="0.4" />

  <!-- The Shield Body -->
  <path d="M256,105 L370,170 L370,300 C370,370 256,415 256,415 C256,415 142,370 142,300 L142,170 Z" fill="none" stroke="url(#cyan-glow)" stroke-width="8" filter="url(#glow)" opacity="0.8" />

  <!-- Battery Body (Inside Shield) -->
  <g transform="translate(186, 176)">
    <!-- Battery Outer Frame -->
    <rect x="0" y="20" width="120" height="180" rx="18" fill="none" stroke="url(#emerald-glow)" stroke-width="12" filter="url(#glow)" />
    <!-- Battery Tip (Positive Terminal) -->
    <path d="M35,20 L35,6 C35,2.7 37.7,0 41,0 L79,0 C82.3,0 85,2.7 85,6 L85,20" fill="url(#emerald-glow)" filter="url(#glow)" />
    
    <!-- Charge Blocks (Full Battery Grid) -->
    <rect x="18" y="140" width="84" height="40" rx="6" fill="url(#emerald-glow)" />
    <rect x="18" y="90" width="84" height="40" rx="6" fill="url(#emerald-glow)" />
    <rect x="18" y="40" width="84" height="40" rx="6" fill="url(#emerald-glow)" opacity="0.9" />

    <!-- Lightning Bolt (Charging Spark) -->
    <path d="M60,60 L35,115 L55,115 L45,160 L80,95 L55,95 Z" fill="#ffffff" filter="url(#glow)" transform="translate(5, 5) scale(0.9)" opacity="0.95"/>
  </g>
</svg>
